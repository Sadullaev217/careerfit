# One deploy of one commit to the public demo: migrations, then the API on Modal, then the web app on
# Vercel, then a check that both answer. Called by deploy.yml.
#
# Secrets and variables carry the environment's name as a prefix (STAGING_), so a second environment
# could reuse this file without GitHub's paid environment secrets. docs/deployment.md lists them all.
name: Deploy one environment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      sha:
        type: string
        required: true

env:
  PREFIX: ${{ inputs.environment == 'production' && 'PRODUCTION' || 'STAGING' }}

jobs:
  migrate:
    name: Database migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Apply new migrations
        env:
          SUPABASE_DB_URL: ${{ secrets[format('{0}_SUPABASE_DB_URL', env.PREFIX)] }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "Set ${PREFIX}_SUPABASE_DB_URL first (docs/deployment.md)"; exit 1; }
          supabase db push --remote="$SUPABASE_DB_URL" --yes

  api:
    name: API on Modal
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: astral-sh/setup-uv@v5
      # Builds the image from apps/api/Dockerfile on Modal and replaces the running app. Settings live in
      # the Modal secret careerfit-demo (docs/deployment.md).
      - name: Deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          [ -n "$MODAL_TOKEN_ID" ] && [ -n "$MODAL_TOKEN_SECRET" ] ||
            { echo "Set MODAL_TOKEN_ID and MODAL_TOKEN_SECRET first (docs/deployment.md)"; exit 1; }
          uvx --from modal==1.6.4 modal deploy deploy/modal_app.py

  web:
    name: Web app on Vercel
    needs: api
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npm install --global vercel@latest
      # The demo is the Vercel project's production deployment, so it lives at the project's own address.
      - name: Build and deploy
        id: deploy
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          echo "url=${{ vars[format('{0}_WEB_URL', env.PREFIX)] }}" >> "$GITHUB_OUTPUT"

  smoke:
    name: Both answer after the deploy
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: API is ready and the web app loads
        env:
          API_URL: ${{ vars[format('{0}_API_URL', env.PREFIX)] }}
          WEB_URL: ${{ needs.web.outputs.url }}
        run: |
          for i in $(seq 1 12); do
            curl -sf "$API_URL/health/ready" && break
            [ "$i" = 12 ] && { echo "API not ready"; exit 1; }
            sleep 10
          done
          echo
          curl -sf -o /dev/null -w "web %{http_code}\n" "$WEB_URL/en"
