# One deploy of one commit to the public demo: migrations, then the server (API, workers, AI model)
# over SSH, then the web app on Vercel, then a check that both answer. Called by deploy.yml.
#
# Secrets and variables carry the environment's name as a prefix (STAGING_), so a second environment
# could reuse this file without GitHub's paid environment secrets. docs/deployment.md lists them all.
name: Deploy one environment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      sha:
        type: string
        required: true

env:
  PREFIX: ${{ inputs.environment == 'production' && 'PRODUCTION' || 'STAGING' }}

jobs:
  migrate:
    name: Database migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Apply new migrations
        env:
          SUPABASE_DB_URL: ${{ secrets[format('{0}_SUPABASE_DB_URL', env.PREFIX)] }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "Set ${PREFIX}_SUPABASE_DB_URL first (docs/deployment.md)"; exit 1; }
          supabase db push --remote="$SUPABASE_DB_URL" --yes

  server:
    name: API, workers and AI on the server
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SSH_HOST: ${{ vars[format('{0}_SSH_HOST', env.PREFIX)] }}
      SSH_USER: ${{ vars[format('{0}_SSH_USER', env.PREFIX)] || 'ubuntu' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: Set up SSH with the server's known host key
        env:
          SSH_KEY: ${{ secrets[format('{0}_SSH_KEY', env.PREFIX)] }}
          KNOWN_HOSTS: ${{ secrets[format('{0}_SSH_KNOWN_HOSTS', env.PREFIX)] }}
        run: |
          [ -n "$SSH_HOST" ] && [ -n "$SSH_KEY" ] && [ -n "$KNOWN_HOSTS" ] ||
            { echo "Set ${PREFIX}_SSH_HOST, ${PREFIX}_SSH_KEY and ${PREFIX}_SSH_KNOWN_HOSTS first"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Send this commit to the server and start it
        run: |
          release="careerfit/releases/${{ inputs.sha }}"
          git archive --format=tar.gz "${{ inputs.sha }}" |
            ssh "$SSH_USER@$SSH_HOST" "mkdir -p ~/$release && tar -xz -C ~/$release"
          # Building on two Arm cores takes several minutes, more the first time.
          ssh "$SSH_USER@$SSH_HOST" "bash ~/$release/scripts/server-deploy.sh"

  web:
    name: Web app on Vercel
    needs: server
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npm install --global vercel@latest
      # The demo is the Vercel project's production deployment, so it lives at the project's own address.
      - name: Build and deploy
        id: deploy
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          echo "url=${{ vars[format('{0}_WEB_URL', env.PREFIX)] }}" >> "$GITHUB_OUTPUT"

  smoke:
    name: Both answer after the deploy
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: API is ready and the web app loads
        env:
          API_URL: ${{ vars[format('{0}_API_URL', env.PREFIX)] }}
          WEB_URL: ${{ needs.web.outputs.url }}
        run: |
          for i in $(seq 1 12); do
            curl -sf "$API_URL/health/ready" && break
            [ "$i" = 12 ] && { echo "API not ready"; exit 1; }
            sleep 10
          done
          echo
          curl -sf -o /dev/null -w "web %{http_code}\n" "$WEB_URL/en"
