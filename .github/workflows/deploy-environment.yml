# One deploy of one commit to staging or production: migrations, then the API and workers on Render, then
# the web app on Vercel, then a check that both answer. Called by deploy.yml, never on its own.
#
# Secrets and variables carry the environment's name as a prefix (STAGING_ or PRODUCTION_), so this works
# without GitHub's paid environment secrets. docs/deployment.md lists them all.
name: Deploy one environment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      sha:
        type: string
        required: true

env:
  PREFIX: ${{ inputs.environment == 'production' && 'PRODUCTION' || 'STAGING' }}

jobs:
  migrate:
    name: Database migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Apply new migrations
        env:
          SUPABASE_DB_URL: ${{ secrets[format('{0}_SUPABASE_DB_URL', env.PREFIX)] }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "Set ${PREFIX}_SUPABASE_DB_URL first (docs/deployment.md)"; exit 1; }
          supabase db push --remote="$SUPABASE_DB_URL" --yes

  api:
    name: API and workers on Render
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: Deploy each service and wait until it is live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICES: ${{ vars[format('{0}_RENDER_SERVICE_IDS', env.PREFIX)] }}
        run: |
          [ -n "$SERVICES" ] || { echo "Set the ${PREFIX}_RENDER_SERVICE_IDS variable first"; exit 1; }
          pids=()
          for service in $SERVICES; do
            bash scripts/render-deploy.sh "$service" "${{ inputs.sha }}" &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          exit "$failed"

  web:
    name: Web app on Vercel
    needs: api
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npm install --global vercel@latest
      # Vercel's Preview settings hold staging's addresses and keys, Production's hold production's.
      - name: Build and deploy
        id: deploy
        run: |
          if [ "${{ inputs.environment }}" = production ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            vercel build --token="$VERCEL_TOKEN"
            url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
            domain="${{ vars.STAGING_WEB_DOMAIN }}"
            if [ -n "$domain" ]; then
              vercel alias set "$url" "$domain" --token="$VERCEL_TOKEN"
              url="https://$domain"
            fi
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  smoke:
    name: Both answer after the deploy
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: API is ready and the web app loads
        env:
          API_URL: ${{ vars[format('{0}_API_URL', env.PREFIX)] }}
          WEB_URL: ${{ needs.web.outputs.url }}
        run: |
          for i in $(seq 1 12); do
            curl -sf "$API_URL/health/ready" && break
            [ "$i" = 12 ] && { echo "API not ready"; exit 1; }
            sleep 10
          done
          echo
          curl -sf -o /dev/null -w "web %{http_code}\n" "$WEB_URL/en"
