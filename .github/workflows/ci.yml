name: CI

on:
  push:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/check-secrets.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @careerfit/shared build
      - run: pnpm --filter "!api" -r --if-present typecheck
      - run: pnpm --filter @careerfit/shared lint
      - run: pnpm --filter web lint
      - run: pnpm --filter mobile exec eslint .
      - run: pnpm --filter web build

  api:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci_only@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379/0
      RUN_EMBEDDING_TESTS: '1'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-rus
      - run: uv run --python 3.12 --extra dev ruff check .
      - run: uv run --python 3.12 --extra dev mypy app
      - run: uv run --python 3.12 --extra dev pytest -rs
