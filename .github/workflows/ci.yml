name: CI

on:
  push:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/check-secrets.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @careerfit/shared build
      - run: pnpm --filter "!api" -r --if-present typecheck
      - run: pnpm --filter @careerfit/shared lint
      - run: pnpm --filter web lint
      - run: pnpm --filter mobile exec eslint .
      - run: pnpm --filter web build

  api:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci_only@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379/0
      RUN_EMBEDDING_TESTS: '1'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-rus
      - run: uv run --python 3.12 --extra dev ruff check .
      - run: uv run --python 3.12 --extra dev mypy app
      - run: uv run --python 3.12 --extra dev pytest -rs

  # The web app, the API and a local Supabase together, driven by Playwright (apps/web/e2e).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_SUPABASE_URL: http://127.0.0.1:54321
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Start a local Supabase with the migrations and seed
        run: |
          supabase gen signing-key --algorithm ES256 2>/dev/null | jq -s . > supabase/signing_keys.json
          sed -i 's|^# signing_keys_path = |signing_keys_path = |' supabase/config.toml
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
          supabase status -o json > "$RUNNER_TEMP/supabase.json"
          node -e "console.log('status keys:', Object.keys(require(process.argv[1])).join(', '))" "$RUNNER_TEMP/supabase.json"
          {
            echo "E2E_SUPABASE_SECRET_KEY=$(node -p "const s=require(process.argv[1]); s.SECRET_KEY || s.SERVICE_ROLE_KEY" "$RUNNER_TEMP/supabase.json")"
            echo "E2E_SUPABASE_PUBLISHABLE_KEY=$(node -p "const s=require(process.argv[1]); s.PUBLISHABLE_KEY || s.ANON_KEY" "$RUNNER_TEMP/supabase.json")"
          } >> "$GITHUB_ENV"
      - name: Local sign-ins use the signing key the API accepts
        run: |
          curl -s "$E2E_SUPABASE_URL/auth/v1/.well-known/jwks.json" | jq -c '[.keys[] | {kty, alg}]'
          node -e "
            const s = require(process.argv[1]);
            fetch(process.env.E2E_SUPABASE_URL + '/auth/v1/signup', {
              method: 'POST',
              headers: { apikey: s.PUBLISHABLE_KEY || s.ANON_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: 'jwt-check@example.com', password: 'jwt-check-local-only' }),
            }).then((r) => r.json()).then((b) => {
              const [h, p] = b.access_token.split('.').slice(0, 2).map((x) => JSON.parse(Buffer.from(x, 'base64url')));
              console.log('alg', h.alg, 'iss', p.iss);
              if (h.alg !== 'ES256') process.exit(1);
            });
          " "$RUNNER_TEMP/supabase.json"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @careerfit/shared build
      - name: Start the API with the demo model
        working-directory: apps/api
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          LLM_PROVIDER: demo
          CELERY_TASK_ALWAYS_EAGER: 'true'
          WEB_URL: http://localhost:3000
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
        run: |
          SUPABASE_SECRET_KEY="$E2E_SUPABASE_SECRET_KEY" nohup uv run --python 3.12 uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - name: Build and start the web app
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: |
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$E2E_SUPABASE_PUBLISHABLE_KEY"
          pnpm --filter web build
          nohup pnpm --filter web start > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/en > /dev/null && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/web.log"; exit 1
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
      - name: Server logs
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API and worker image
        run: docker build -t careerfit-api apps/api
      - name: The image starts and answers health checks
        run: |
          docker run -d --name api -p 8000:8000 careerfit-api
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1

  # Backs up a local Supabase, rebuilds it empty and restores it (scripts/backup-drill.sh).
  backup-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Start a local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
      - run: bash scripts/backup-drill.sh
