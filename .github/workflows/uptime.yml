# Checks every 10 minutes that staging and production answer. A failed run is the alert: GitHub emails
# whoever enabled Actions notifications for failed scheduled runs (docs/runbook.md). Addresses come from
# repository variables; an environment without them is skipped.
name: Uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        environment: [STAGING, PRODUCTION]
    steps:
      - name: API ready, web app loads
        env:
          API_URL: ${{ vars[format('{0}_API_URL', matrix.environment)] }}
          WEB_URL: ${{ vars[format('{0}_WEB_URL', matrix.environment)] }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$WEB_URL" ]; then
            echo "${{ matrix.environment }} isn't set up yet"; exit 0
          fi
          check() {
            # Two tries, so one dropped request doesn't page anyone.
            curl -sf --max-time 20 -o /dev/null -w "$1 %{http_code} in %{time_total}s\n" "$1" ||
              { sleep 30; curl -sf --max-time 20 -o /dev/null -w "$1 %{http_code} in %{time_total}s\n" "$1"; }
          }
          check "$API_URL/health/ready"
          check "$WEB_URL/en"
