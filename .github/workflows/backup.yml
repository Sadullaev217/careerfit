# A nightly encrypted backup of production (database and uploaded files), kept as a workflow artifact for
# 14 days. Restore with scripts/restore.sh (docs/runbook.md). Skipped until the secrets are set.
name: Backup

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch: {}

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Production is set up
        id: ready
        run: |
          if [ -n "$SUPABASE_DB_URL" ] && [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SECRET_KEY" ] && [ -n "$BACKUP_PASSPHRASE" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Production backup secrets aren't set yet (docs/deployment.md)"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok
      - uses: astral-sh/setup-uv@v5
        if: steps.ready.outputs.ok
      - uses: supabase/setup-cli@v1
        if: steps.ready.outputs.ok
        with:
          version: 3.1.0
      - run: bash scripts/backup.sh "$RUNNER_TEMP/backup"
        if: steps.ready.outputs.ok
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.ok
        with:
          name: production-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backup/*.gpg
          retention-days: 14
          if-no-files-found: error
