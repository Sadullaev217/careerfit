# Staging gets every commit on main that passes CI. It can also be redeployed by hand (Actions, Deploy,
# Run workflow). Staging is the only hosted environment; deploy-environment.yml would also take
# `production` if one were added (docs/deployment.md).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# One deploy at a time; a newer one waits instead of cancelling a half-finished deploy.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push')
      || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
