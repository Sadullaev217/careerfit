# Staging gets every commit on main that passes CI. Production gets a commit only when someone runs this
# workflow by hand (Actions, Deploy, Run workflow, production), normally after checking it on staging.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy the chosen branch's latest commit
        type: choice
        options: [staging, production]
        default: staging

# One deploy per environment at a time; a newer one waits instead of cancelling a half-finished deploy.
concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  staging:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      sha: ${{ github.sha }}
    secrets: inherit
