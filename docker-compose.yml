services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: careerfit
      POSTGRES_PASSWORD: careerfit_local_only
      POSTGRES_DB: careerfit
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careerfit']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Virus scanning for uploads. Optional locally: docker compose --profile scan up -d clamav, then set
  # MALWARE_SCANNER=clamav. The first start downloads signatures, which takes a few minutes.
  clamav:
    image: clamav/clamav:1.4
    profiles: ['scan']
    ports:
      - '3310:3310'

volumes:
  postgres_data:
